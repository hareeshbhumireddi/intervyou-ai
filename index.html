    <meta charset="UTF-8" />

    <meta name="theme-color" content="#2563EB" />
    <script>
      // Suppress benign Vite dev server HMR WebSocket connection errors inside Cloud Run preview iframe
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = String((reason && (reason.message || reason)) || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = String((event && (event.message || event)) || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
